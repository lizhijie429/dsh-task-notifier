# Bundle layer for `dsh-task-notifier`.
#
# A profile that lists this bundle in `dsh.profile.bundles` gets one inserted
# loader entry. Every value below is the documented default; delete a key (or
# the whole `config:` block) to keep the built-in default, or override the row
# from the profile's own `cordis.patch.yml` by targeting `id: task-notifier`.
- insert:
    - id: task-notifier
      name: '@lizhijie429/dsh-task-notifier'
      config:
        # Which lifecycle edges produce a desktop notification.
        notifyOnStart: false
        notifyOnComplete: true
        notifyOnError: true
        notifyOnAbort: false
        notifyOnStep: false
        # Notify for sub-agent sessions too (off keeps delegation quiet).
        notifySubagents: false
        # Notify when an approval prompt stays pending for the user.
        notifyOnApproval: true
        # Approvals answered within this window are treated as automatic and
        # do not raise a notification (policy `never` answers immediately).
        approvalGraceMs: 1000
        # Notify when DSH waits on a user answer (ask_user_question) or a plan
        # review (exit_plan_mode); questions answered within the grace window
        # stay silent.
        notifyOnQuestion: true
        questionGraceMs: 1000
        # auto | windows | macos | linux | log | none
        channel: auto
        titlePrefix: DSH
        maxBodyChars: 240
        # Keep model output out of OS notifications (lock-screen privacy).
        includePreview: false
        # Network / model-request failures re-submit this prompt to the same
        # agent. `requireRetryExhausted: true` narrows it to exhausted budgets.
        autoContinue:
          enabled: true
          message: 继续
          maxAttempts: 3
          cooldownMs: 5000
          requireRetryExhausted: false
          # Honor providerRetryAfterMs (e.g. 429 rate limits) before retrying.
          respectProviderRetryAfter: true
